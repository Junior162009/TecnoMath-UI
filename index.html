<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TecnoMath — Plataforma educativa</title>
<meta name="description" content="TecnoMath: aprende matemáticas jugando, compite y progresa.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700&display=swap');
:root{--bg:#070711;--bg2:#0c0c1e;--card:#111128;--card2:#181836;--line:rgba(255,255,255,.08);--text:#f1f5f9;--muted:#8892a4;--violet:#7c3aed;--violet2:#a78bfa;--cyan:#38bdf8;--green:#10b981;--gold:#f59e0b;--red:#f43f5e;--r:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#151132 0,#070711 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}body.light{--bg:#f5f7fb;--bg2:#fff;--card:#fff;--card2:#f1f3f8;--line:rgba(15,23,42,.1);--text:#111827;--muted:#64748b;background:#f5f7fb}.app{min-height:100vh}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:245px;background:rgba(8,8,20,.92);border-right:1px solid var(--line);padding:22px 14px;backdrop-filter:blur(18px)}.light .side{background:rgba(255,255,255,.94)}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 8px 30px #7c3aed55;font-size:20px}.brand b{font:700 20px Oxanium}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em}.nav{display:grid;gap:6px}.nav button{border:0;background:none;color:var(--muted);padding:12px;border-radius:11px;text-align:left;font:600 13px Inter;cursor:pointer}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#7c3aed20,transparent);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--violet)}.nav i{font-style:normal;width:26px;display:inline-block}.side-bottom{position:absolute;bottom:18px;left:14px;right:14px;display:grid;gap:8px}.mini{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px}.mini small{color:var(--muted)}.main{margin-left:245px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(7,7,17,.55);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.light .top{background:rgba(255,255,255,.75)}.top h1{font:700 18px Oxanium;margin:0}.actions{display:flex;gap:9px;align-items:center}.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600}.btn.primary{background:linear-gradient(135deg,var(--violet),#5b21b6);border-color:transparent}.wrap{padding:28px 32px 60px;max-width:1450px;margin:auto}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.hero-card{padding:28px;border:1px solid #7c3aed33;border-radius:20px;background:linear-gradient(135deg,#171338,#0e0e20 70%);position:relative;overflow:hidden}.hero-card:after{content:'∑  π  √  ∞';position:absolute;right:-20px;bottom:-20px;font:700 100px Oxanium;color:#ffffff07;letter-spacing:10px}.eyebrow{color:var(--violet2);font:600 11px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.hero h2{font:800 34px Oxanium;margin:10px 0}.hero p{color:var(--muted);max-width:620px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{border:1px solid var(--line);background:linear-gradient(145deg,var(--card),var(--bg2));border-radius:var(--r)}.stat{padding:17px}.stat small,.card small{color:var(--muted)}.stat strong{display:block;font:700 23px Oxanium;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-head h3{font:700 19px Oxanium;margin:0}.card{padding:18px}.game{overflow:hidden;padding:0}.game-img{height:125px;background:linear-gradient(135deg,#312e81,#0ea5e955),radial-gradient(circle at 70% 30%,#a78bfa 0,transparent 35%);display:grid;place-items:center;font:700 48px Oxanium;color:#fff}.game-body{padding:16px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#7c3aed20;color:var(--violet2);font-size:11px;font-weight:700}.game h4{margin:10px 0 6px;font-size:16px}.game p{color:var(--muted);font-size:12px;line-height:1.5;min-height:36px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.xp{height:7px;background:#ffffff0d;border-radius:99px;overflow:hidden;margin:8px 0}.xp span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:inherit}.table{display:grid;gap:8px}.rank{display:grid;grid-template-columns:45px 1fr 100px 80px;align-items:center;gap:10px;padding:13px 15px}.rank.top1{border-color:#f59e0b55}.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#0ea5e9);display:grid;place-items:center;font-weight:800}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:30}.modal.show{display:grid}.modal-box{width:min(480px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.mobile{display:none}@media(max-width:950px){.side{width:72px}.brand div,.nav button span,.side-bottom{display:none}.brand{justify-content:center;padding:4px 0 24px}.nav button{text-align:center}.main{margin-left:72px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{display:none}.main{margin-left:0}.mobile{display:block}.top{padding:0 16px}.wrap{padding:20px 16px 50px}.grid,.stats{grid-template-columns:1fr}.hero h2{font-size:27px}.rank{grid-template-columns:38px 1fr 70px}.rank .hide{display:none}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="logo">∑</div><div><b>TecnoMath</b><span>LEARN • PLAY • MASTER</span></div></div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="mini"><small>🔥 Racha actual</small><strong>7 días</strong></div><button class="btn" onclick="toggleTheme()">◐ Cambiar tema</button></div></aside><main class="main"><header class="top"><div class="mobile"><button class="pill" onclick="alert('Usa el menú de navegación desde una pantalla más grande.')">☰</button></div><h1 id="title">Inicio</h1><div class="actions"><button class="pill" onclick="toggleTheme()">◐</button><button class="pill">🔔</button><button class="pill" onclick="showProfile()">CM · Nivel 23</button></div></header><div class="wrap" id="page"></div></main></div><div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const nav=[['home','⌂','Inicio'],['games','🎮','Juegos'],['tournaments','🏆','Torneos'],['rankings','📊','Ranking'],['community','🌐','Comunidad'],['progress','📈','Progreso'],['profile','👤','Perfil']];
const games=[['Algebra Blitz','Álgebra','Duelos de ecuaciones en tiempo real.','⚡','150 XP',72],['Grid Geometry','Geometría','Conquista el plano cartesiano.','◈','100 XP',45],['Calculus Quest','Cálculo','Límites, derivadas e integrales.','∫','300 XP',0],['Number Rush','Aritmética','Cálculo mental a máxima velocidad.','123','80 XP',100],['Infinity Loop','Cálculo','Secuencias y series en mundo puzzle.','∞','250 XP',15],['Fraction Wars','Aritmética','Simplifica fracciones y conquista.','½','120 XP',55],['Logic Gates','Lógica','Tablas de verdad y circuitos.','⊕','200 XP',0],['Speed Math','Aritmética','60 segundos para superar tu récord.','×','130 XP',88],['Prime Hunters','Teoría','Encuentra primos antes del tiempo.','ℙ','140 XP',30]];
const players=['MathKing_Alex','ProCalc_Sofia','NumeroUno_Max','AlgebraLord','MathWizard_Zoe','CalcQueen_Mia','NumberNinja','PrimeMaster','TechMath_Carlos'];
function navRender(active){document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${n[0]==active?'active':''}" onclick="go('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}
function go(p){history.replaceState({},'', '#'+p);render(p)}
function render(p=location.hash.slice(1)||'home'){navRender(p);let n=nav.find(x=>x[0]==p)||nav[0];document.getElementById('title').textContent=n[2];let f={home:home,games:gamesPage,tournaments:tournaments,rankings:rankings,community:community,progress:progress,profile:profile}[p]||home;document.getElementById('page').innerHTML=f()}
function home(){return `<section class="hero"><div class="hero-card"><div class="eyebrow">PLATAFORMA EDUCATIVA</div><h2>Domina las matemáticas jugando.</h2><p>Entrena, compite y sube de nivel en una experiencia creada para convertir cada ejercicio en un reto.</p><button class="btn primary" onclick="go('games')">🎮 Explorar juegos</button></div><div class="card"><small>Tu progreso</small><h2 style="font:700 30px Oxanium;margin:8px 0">45,200 XP</h2><div class="xp"><span style="width:90%"></span></div><small>90% · 4,800 XP para nivel 24</small><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="row"><span>🔥 Racha</span><b>7 días</b></div><div class="row" style="margin-top:12px"><span>🏅 Ranking</span><b>#47</b></div></div></section><section class="section"><div class="stats"><div class="stat"><small>Partidas</small><strong>142</strong></div><div class="stat"><small>Victorias</small><strong>97</strong></div><div class="stat"><small>Monedas</small><strong>3,450</strong></div><div class="stat"><small>Amigos</small><strong>38</strong></div></div></section><section class="section"><div class="section-head"><h3>🔥 Juegos destacados</h3><button class="btn" onclick="go('games')">Ver todos</button></div><div class="grid">${games.slice(0,3).map(gameCard).join('')}</div></section>`}
function gameCard(g){return `<article class="card game"><div class="game-img">${g[3]}</div><div class="game-body"><span class="tag">${g[1]}</span><h4>${g[0]}</h4><p>${g[2]}</p><div class="row"><small>${g[4]}</small><small>${g[5]}%</small></div><div class="xp"><span style="width:${g[5]}%"></span></div><button class="btn primary" style="width:100%" onclick="play('${g[0]}')">${g[5]?'Continuar':'Jugar ahora'} →</button></div></article>`}
function gamesPage(){return `<div class="section-head"><div><h3>Biblioteca de juegos</h3><small>Retos de matemáticas para todos los niveles.</small></div><button class="btn primary" onclick="go('games')">+ Nuevo reto</button></div><div class="grid">${games.map(gameCard).join('')}</div>`}
function tournaments(){return `<div class="card" style="margin-bottom:15px"><div class="eyebrow">COMPETICIÓN</div><h2 style="font:700 25px Oxanium">🏆 Torneos activos</h2><p style="color:var(--muted)">Compite contra la comunidad y consigue XP, monedas y trofeos.</p></div><div class="grid">${[['Grand Prix de Álgebra','12h 34m','2,500 XP'],['Olimpiada de Geometría','2d 08h','1,800 XP'],['Copa Cálculo Infinito','4d 12h','5,000 XP']].map(x=>`<div class="card"><span class="tag">EN CURSO</span><h3>${x[0]}</h3><p style="color:var(--muted)">⏱ ${x[1]}</p><div class="row"><b>🏅 ${x[2]}</b><button class="btn primary" onclick="play('${x[0]}')">Participar</button></div></div>`).join('')}</div>`}
function rankings(){return `<div class="card"><div class="section-head"><h3>🌎 Ranking global</h3><span class="tag">TEMPORADA 12</span></div><div class="table">${players.map((p,i)=>`<div class="card rank ${i==0?'top1':''}"><b>#${i+1}</b><div class="row" style="justify-content:flex-start"><div class="avatar">${p.slice(0,2).toUpperCase()}</div><strong>${p}</strong></div><b>${(58400-i*930).toLocaleString()} XP</b><span class="hide">${i<3?'🏆':'⭐'}</span></div>`).join('')}</div></div>`}
function community(){return `<div class="hero-card"><div class="eyebrow">TECNOMATH SOCIAL</div><h2>Tu comunidad matemática.</h2><p>Comparte logros, sigue a tus amigos y descubre quién está subiendo más rápido.</p><button class="btn primary" onclick="alert('Publicación creada en modo demo')">＋ Crear publicación</button></div><section class="section"><div class="grid">${[['MathKing_Alex','🔥 Nuevo récord en Algebra Blitz: 9,820 puntos.'],['ProCalc_Sofia','🏆 Gané el torneo de Geometría.'],['TechMath_Carlos','🚀 Nivel 23 desbloqueado. ¡Vamos por el 24!']].map(x=>`<article class="card"><div class="row"><div class="row" style="justify-content:flex-start"><div class="avatar">${x[0].slice(0,2).toUpperCase()}</div><b>${x[0]}</b></div><small>hace poco</small></div><p style="line-height:1.6">${x[1]}</p><div class="row"><button class="pill">❤️ 24</button><button class="pill">💬 Comentar</button></div></article>`).join('')}</div></section>`}
function progress(){return `<div class="hero-card"><div class="eyebrow">NIVEL 23</div><h2>45,200 / 50,000 XP</h2><div class="xp"><span style="width:90%"></span></div><p>Te faltan 4,800 XP para llegar al nivel 24.</p></div><section class="section"><div class="stats"><div class="stat"><small>🔥 Racha máxima</small><strong>21 días</strong></div><div class="stat"><small>🎯 Precisión</small><strong>91%</strong></div><div class="stat"><small>⏱ Horas jugadas</small><strong>48 h</strong></div><div class="stat"><small>🏅 Logros</small><strong>23/40</strong></div></div></section><section class="section"><div class="card"><h3>Actividad semanal</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:20px">${[55,80,35,100,70,90,45].map((v,i)=>`<div style="height:${v}%;background:linear-gradient(var(--violet),var(--cyan));border-radius:8px 8px 2px 2px;position:relative"><small style="position:absolute;bottom:-22px;left:50%;transform:translateX(-50%)">${'LMXJVSD'[i]}</small></div>`).join('')}</div></div></section>`}
function profile(){return `<div class="hero-card"><div class="row" style="justify-content:flex-start"><div class="avatar" style="width:72px;height:72px;font-size:24px">CM</div><div><div class="eyebrow">NIVEL 23</div><h2 style="margin:5px 0">TechMath_Carlos</h2><small>Miembro desde enero 2024 · 🇲🇽</small></div></div></div><section class="section"><div class="grid"><div class="card"><small>Victorias</small><h2>97</h2><p style="color:var(--muted)">68% de tus partidas</p></div><div class="card"><small>Ranking</small><h2>#47</h2><p style="color:var(--muted)">Top 5% global</p></div><div class="card"><small>Monedas</small><h2>3,450</h2><p style="color:var(--muted)">Disponibles para gastar</p></div></div></section>`}
function play(name){document.getElementById('modalBox').innerHTML=`<div class="eyebrow">MODO DEMO</div><h2 style="font:700 25px Oxanium">🎮 ${name}</h2><p style="color:var(--muted);line-height:1.6">El juego se abrirá desde la biblioteca de TecnoMath. Esta pantalla conecta el nuevo UI con tus juegos existentes.</p><button class="btn primary" onclick="closeModal()">Listo</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function showProfile(){go('profile')};function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('tm-theme',document.body.classList.contains('light')?'light':'dark')}
if(localStorage.getItem('tm-theme')==='light')document.body.classList.add('light');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
